plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
}

configurations.configureEach {
    resolutionStrategy.capabilitiesResolution.withCapability('com.google.guava:listenablefuture') {
        select('com.google.guava:guava:32.1.1-jre')
    }
}

android {
    namespace 'com.licensechain'
    compileSdk 35

    defaultConfig {
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.0.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.auth0:jwks-rsa:0.22.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

group = 'io.github.licensechain'
version = '1.0.2'

mavenPublishing {
    // Central + signing enabled via gradle.properties
    // (mavenCentralPublishing / mavenCentralAutomaticPublishing / signAllPublications)

    coordinates('io.github.licensechain', 'licensechain-android-sdk', '1.0.2')

    pom {
        name = 'LicenseChain Android SDK'
        description = 'Official Android SDK for LicenseChain - Secure license management for Android applications'
        inceptionYear = '2024'
        url = 'https://github.com/LicenseChain/LicenseChain-Android-SDK'
        licenses {
            license {
                name = 'Elastic License 2.0'
                url = 'https://www.elastic.co/licensing/elastic-license'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'licensechain'
                name = 'LicenseChain Team'
                email = 'support@licensechain.app'
                organization = 'LicenseChain LLC'
                organizationUrl = 'https://licensechain.app'
            }
        }
        scm {
            url = 'https://github.com/LicenseChain/LicenseChain-Android-SDK'
            connection = 'scm:git:git://github.com/LicenseChain/LicenseChain-Android-SDK.git'
            developerConnection = 'scm:git:ssh://git@github.com/LicenseChain/LicenseChain-Android-SDK.git'
        }
    }
}
